<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STL Community Clothing Sale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M 50 5 Q 20 30 20 50 Q 20 80 50 95 Q 80 80 80 50 Q 80 30 50 5 Z' fill='%232563eb'/><rect x='60' y='35' width='20' height='30' rx='2' fill='white'/><path d='M 67 35 L 67 28 L 73 28 L 73 35' stroke='white' stroke-width='2' fill='none'/><text x='70' y='53' font-size='12' text-anchor='middle' fill='%232563eb' font-weight='bold'>$</text></svg>">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        // Icon components
        const Search = () => (
            <svg className="absolute left-3 top-3 text-gray-400" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
            </svg>
        );

        const RefreshCw = ({ size = 20, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                <path d="M21 3v5h-5"></path>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                <path d="M3 21v-5h5"></path>
            </svg>
        );

        const Mail = () => (
            <svg className="mr-2 text-blue-600" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
        );

        const Phone = () => (
            <svg className="mr-2 text-blue-600" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
        );

        const MessageCircle = () => (
            <svg className="mr-2 text-blue-600" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path>
            </svg>
        );

        const X = ({ size = 16, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        );

        const ClothingSale = () => {
          const [searchTerm, setSearchTerm] = useState('');
          const [filterCategory, setFilterCategory] = useState('All');
          const [sortOrder, setSortOrder] = useState('newest');
          const [items, setItems] = useState([]);
          const [loading, setLoading] = useState(true);
          const [error, setError] = useState(null);

          const SHEET_ID = '1qInatoDfGMrvn6qtjQizDzj6vy9gQHDnTy3S7NyCKQ4';
          const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

          const fetchData = async () => {
            setLoading(true);
            setError(null);
            try {
              const response = await fetch(SHEET_URL);
              const csvText = await response.text();
              
              const lines = csvText.split('\n');
              
              const parsedItems = [];
              for (let i = 1; i < lines.length; i++) {
                const line = lines[i];
                if (!line.trim()) continue;
                
                const values = [];
                let current = '';
                let inQuotes = false;
                
                for (let j = 0; j < line.length; j++) {
                  const char = line[j];
                  if (char === '"') {
                    inQuotes = !inQuotes;
                  } else if (char === ',' && !inQuotes) {
                    values.push(current);
                    current = '';
                  } else {
                    current += char;
                  }
                }
                values.push(current);
                
                if (values.length < 10 || !values[2]) continue;
                
                let images = [];
                if (values[13]) {
                  // Handle multiple image URLs separated by commas
                  const imageLinks = values[13].split(',').map(link => link.trim());
                  
                  imageLinks.forEach(link => {
                    // Extract ID from Google Drive link
                    const match = link.match(/id=([^&\s]+)/);
                    if (match) {
                      // Use thumbnail format which works better for embedding
                      images.push(`https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`);
                    }
                  });
                }
                
                parsedItems.push({
                  id: i,
                  name: values[1] || '',
                  email: values[2] || '',
                  phone: values[3] || '',
                  contactPref: values[4] || '',
                  category: values[5] || '',
                  type: values[6] || '',
                  brand: values[7] || '',
                  size: values[8] || '',
                  color: values[9] || '',
                  price: values[10] || '',
                  link: values[11] || '',
                  notes: values[12] || '',
                  images: images
                });
              }
              
              setItems(parsedItems);
              setLoading(false);
            } catch (err) {
              setError('Failed to load items. Please try again.');
              setLoading(false);
              console.error('Error fetching data:', err);
            }
          };

          useEffect(() => {
            fetchData();
          }, []);

          const categories = ['All', ...new Set(items.map(item => item.category).filter(Boolean))];

          let filteredItems = items.filter(item => {
            const matchesSearch = item.brand.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                 item.type.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                 item.color.toLowerCase().includes(searchTerm.toLowerCase());
            const matchesCategory = filterCategory === 'All' || item.category === filterCategory;
            return matchesSearch && matchesCategory;
          });

          // Sort items based on sort order
          if (sortOrder === 'oldest') {
            filteredItems = filteredItems.sort((a, b) => a.id - b.id);
          } else if (sortOrder === 'price-low') {
            filteredItems = filteredItems.sort((a, b) => {
              const priceA = parseFloat(a.price.replace(/[^0-9.]/g, '')) || 0;
              const priceB = parseFloat(b.price.replace(/[^0-9.]/g, '')) || 0;
              return priceA - priceB;
            });
          } else if (sortOrder === 'price-high') {
            filteredItems = filteredItems.sort((a, b) => {
              const priceA = parseFloat(a.price.replace(/[^0-9.]/g, '')) || 0;
              const priceB = parseFloat(b.price.replace(/[^0-9.]/g, '')) || 0;
              return priceB - priceA;
            });
          } else {
            filteredItems = filteredItems.sort((a, b) => b.id - a.id);
          }

          if (loading) {
            return (
              <div className="min-h-screen bg-gradient-to-br from-blue-50 via-sky-50 to-cyan-50 flex items-center justify-center">
                <div className="text-center">
                  <RefreshCw size={48} className="animate-spin text-blue-600 mx-auto mb-4" />
                  <p className="text-xl text-gray-700">Loading items...</p>
                </div>
              </div>
            );
          }

          if (error) {
            return (
              <div className="min-h-screen bg-gradient-to-br from-blue-50 via-sky-50 to-cyan-50 flex items-center justify-center">
                <div className="text-center">
                  <p className="text-xl text-red-600 mb-4">{error}</p>
                  <button
                    onClick={fetchData}
                    className="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
                  >
                    Try Again
                  </button>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-gradient-to-br from-blue-50 via-sky-50 to-cyan-50">
              <div className="max-w-7xl mx-auto px-4 py-8">
                <div className="text-center mb-12">
                  <div className="relative inline-block">
                    <h1 className="text-6xl md:text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 via-sky-500 to-cyan-500 mb-2" style={{fontFamily: "'Archivo Black', sans-serif"}}>
                      STL Community
                    </h1>
                    <h2 className="text-4xl md:text-5xl font-bold text-blue-900 mb-4" style={{fontFamily: "'Bebas Neue', sans-serif"}}>
                      Clothing Sale
                    </h2>
                  </div>
                  <p className="text-lg text-gray-600 mb-4 font-medium">Find amazing deals on gently used clothing for the whole family!</p>
                  <button
                    onClick={fetchData}
                    className="mt-2 inline-flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-blue-600 to-sky-500 text-white rounded-full hover:from-blue-700 hover:to-sky-600 transition-all shadow-lg hover:shadow-xl transform hover:scale-105"
                  >
                    <RefreshCw size={16} className="inline" />
                    Refresh Items
                  </button>
                </div>

                <div className="bg-white rounded-2xl shadow-lg p-6 mb-8">
                  <div className="flex flex-col md:flex-row gap-4">
                    <select
                      className="px-4 py-3 border-2 border-blue-200 rounded-lg focus:outline-none focus:border-blue-500"
                      value={filterCategory}
                      onChange={(e) => setFilterCategory(e.target.value)}
                    >
                      {categories.map(cat => (
                        <option key={cat} value={cat}>{cat}</option>
                      ))}
                    </select>
                    <div className="flex-1 relative">
                      <Search />
                      <input
                        type="text"
                        placeholder="Search by brand, type, or color..."
                        className="w-full pl-10 pr-10 py-3 border-2 border-blue-200 rounded-lg focus:outline-none focus:border-blue-500"
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                      />
                      {searchTerm && (
                        <button
                          onClick={() => setSearchTerm('')}
                          className="absolute right-3 top-3 text-gray-400 hover:text-gray-600"
                        >
                          <X size={20} />
                        </button>
                      )}
                    </div>
                    <select
                      className="px-4 py-3 border-2 border-blue-200 rounded-lg focus:outline-none focus:border-blue-500"
                      value={sortOrder}
                      onChange={(e) => setSortOrder(e.target.value)}
                    >
                      <option value="newest">Newest to Oldest</option>
                      <option value="oldest">Oldest to Newest</option>
                      <option value="price-low">Price: Low to High</option>
                      <option value="price-high">Price: High to Low</option>
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                  {filteredItems.map(item => (
                    <div key={item.id} className="bg-white rounded-2xl shadow-lg overflow-hidden hover:shadow-2xl transition-shadow duration-300">
                      {item.images && item.images.length > 0 ? (
                        <div className="h-80 bg-gray-100 overflow-hidden relative">
                          {item.images.length === 1 ? (
                            <img
                              src={item.images[0]}
                              alt={`${item.brand} ${item.type}`}
                              className="w-full h-full object-cover"
                            />
                          ) : (
                            <div className="flex overflow-x-auto snap-x snap-mandatory h-full">
                              {item.images.map((img, idx) => (
                                <img
                                  key={idx}
                                  src={img}
                                  alt={`${item.brand} ${item.type} - Image ${idx + 1}`}
                                  className="w-full h-full object-cover flex-shrink-0 snap-center"
                                />
                              ))}
                            </div>
                          )}
                          {item.images.length > 1 && (
                            <div className="absolute bottom-2 left-1/2 transform -translate-x-1/2 flex gap-1">
                              {item.images.map((_, idx) => (
                                <div key={idx} className="w-2 h-2 rounded-full bg-white opacity-70"></div>
                              ))}
                            </div>
                          )}
                        </div>
                      ) : (
                        <div className="h-80 bg-gradient-to-br from-blue-100 to-sky-100 flex items-center justify-center">
                          <p className="text-gray-500">No photo available</p>
                        </div>
                      )}

                      <div className="p-6">
                        <div className="flex justify-between items-start mb-3">
                          <div>
                            <h3 className="text-2xl font-bold text-blue-900">{item.brand}</h3>
                            <p className="text-sm text-blue-600 font-semibold">{item.category}</p>
                          </div>
                          <span className="text-2xl font-bold text-sky-600">{item.price}</span>
                        </div>

                        <div className="space-y-2 mb-4">
                          <p className="text-gray-700"><span className="font-semibold">Type:</span> {item.type === 'Other' ? 'Other' : item.type}</p>
                          <p className="text-gray-700"><span className="font-semibold">Size:</span> {item.size}</p>
                          <p className="text-gray-700"><span className="font-semibold">Color:</span> {item.color}</p>
                          {item.notes && (
                            <p className="text-sm text-gray-600 italic">{item.notes}</p>
                          )}
                        </div>

                        {item.link && (
                          <a
                            href={item.link}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="inline-block mb-4 text-blue-600 hover:text-blue-800 underline text-sm"
                          >
                            View original listing
                          </a>
                        )}

                        <div className="border-t pt-4 mt-4">
                          <p className="text-sm font-semibold text-gray-900 mb-2">Contact Seller:</p>
                          <div className="space-y-1">
                            <div className="flex items-center text-sm text-gray-700">
                              <Mail />
                              <a href={`mailto:${item.email}`} className="hover:text-blue-600">{item.email}</a>
                            </div>
                            <div className="flex items-center text-sm text-gray-700">
                              <Phone />
                              <span>{item.phone}</span>
                            </div>
                            {item.contactPref && (
                              <div className="flex items-center text-sm text-gray-600">
                                <MessageCircle />
                                <span>Preferred: {item.contactPref}</span>
                              </div>
                            )}
                          </div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                {filteredItems.length === 0 && (
                  <div className="text-center py-20">
                    <p className="text-2xl text-gray-500">No items found matching your search.</p>
                  </div>
                )}
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ClothingSale />);
    </script>
</body>
</html>
