<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STL Community Clothing Sale</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        // Icon components
        const Search = () => (
            <svg className="absolute left-3 top-3 text-gray-400" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
            </svg>
        );

        const RefreshCw = ({ size = 20, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                <path d="M21 3v5h-5"></path>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                <path d="M3 21v-5h5"></path>
            </svg>
        );

        const Mail = () => (
            <svg className="mr-2 text-purple-600" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
        );

        const Phone = () => (
            <svg className="mr-2 text-purple-600" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
        );

        const MessageCircle = () => (
            <svg className="mr-2 text-purple-600" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path>
            </svg>
        );

        const ClothingSale = () => {
          const [searchTerm, setSearchTerm] = useState('');
          const [filterCategory, setFilterCategory] = useState('All');
          const [items, setItems] = useState([]);
          const [loading, setLoading] = useState(true);
          const [error, setError] = useState(null);

          const SHEET_ID = '1qInatoDfGMrvn6qtjQizDzj6vy9gQHDnTy3S7NyCKQ4';
          const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

          const fetchData = async () => {
            setLoading(true);
            setError(null);
            try {
              const response = await fetch(SHEET_URL);
              const csvText = await response.text();
              
              const lines = csvText.split('\n');
              
              const parsedItems = [];
              for (let i = 1; i < lines.length; i++) {
                const line = lines[i];
                if (!line.trim()) continue;
                
                const values = [];
                let current = '';
                let inQuotes = false;
                
                for (let j = 0; j < line.length; j++) {
                  const char = line[j];
                  if (char === '"') {
                    inQuotes = !inQuotes;
                  } else if (char === ',' && !inQuotes) {
                    values.push(current);
                    current = '';
                  } else {
                    current += char;
                  }
                }
                values.push(current);
                
                if (values.length < 10 || !values[2]) continue;
                
                let imageUrl = '';
                if (values[13]) {
                  // Handle multiple image URLs separated by commas
                  const imageLinks = values[13].split(',').map(link => link.trim());
                  const firstLink = imageLinks[0];
                  
                  // Extract ID from Google Drive link
                  const match = firstLink.match(/id=([^&\s]+)/);
                  if (match) {
                    // Use thumbnail format which works better for embedding
                    imageUrl = `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
                  }
                }
                
                parsedItems.push({
                  id: i,
                  name: values[1] || '',
                  email: values[2] || '',
                  phone: values[3] || '',
                  contactPref: values[4] || '',
                  category: values[5] || '',
                  type: values[6] || '',
                  brand: values[7] || '',
                  size: values[8] || '',
                  color: values[9] || '',
                  price: values[10] || '',
                  link: values[11] || '',
                  notes: values[12] || '',
                  image: imageUrl
                });
              }
              
              setItems(parsedItems);
              setLoading(false);
            } catch (err) {
              setError('Failed to load items. Please try again.');
              setLoading(false);
              console.error('Error fetching data:', err);
            }
          };

          useEffect(() => {
            fetchData();
          }, []);

          const categories = ['All', ...new Set(items.map(item => item.category).filter(Boolean))];

          const filteredItems = items.filter(item => {
            const matchesSearch = item.brand.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                 item.type.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                 item.color.toLowerCase().includes(searchTerm.toLowerCase());
            const matchesCategory = filterCategory === 'All' || item.category === filterCategory;
            return matchesSearch && matchesCategory;
          });

          if (loading) {
            return (
              <div className="min-h-screen bg-gradient-to-br from-purple-50 via-pink-50 to-blue-50 flex items-center justify-center">
                <div className="text-center">
                  <RefreshCw size={48} className="animate-spin text-purple-600 mx-auto mb-4" />
                  <p className="text-xl text-gray-700">Loading items...</p>
                </div>
              </div>
            );
          }

          if (error) {
            return (
              <div className="min-h-screen bg-gradient-to-br from-purple-50 via-pink-50 to-blue-50 flex items-center justify-center">
                <div className="text-center">
                  <p className="text-xl text-red-600 mb-4">{error}</p>
                  <button
                    onClick={fetchData}
                    className="px-6 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700"
                  >
                    Try Again
                  </button>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-gradient-to-br from-purple-50 via-pink-50 to-blue-50">
              <div className="max-w-7xl mx-auto px-4 py-8">
                <div className="text-center mb-12">
                  <h1 className="text-5xl font-bold text-purple-900 mb-4">STL Community Clothing Sale</h1>
                  <p className="text-lg text-gray-700">Quality clothing items for the whole family</p>
                  <button
                    onClick={fetchData}
                    className="mt-4 inline-flex items-center gap-2 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors"
                  >
                    <RefreshCw size={16} className="inline" />
                    Refresh Items
                  </button>
                </div>

                <div className="bg-white rounded-2xl shadow-lg p-6 mb-8">
                  <div className="flex flex-col md:flex-row gap-4">
                    <div className="flex-1 relative">
                      <Search />
                      <input
                        type="text"
                        placeholder="Search by brand, type, or color..."
                        className="w-full pl-10 pr-4 py-3 border-2 border-purple-200 rounded-lg focus:outline-none focus:border-purple-500"
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                      />
                    </div>
                    <select
                      className="px-4 py-3 border-2 border-purple-200 rounded-lg focus:outline-none focus:border-purple-500"
                      value={filterCategory}
                      onChange={(e) => setFilterCategory(e.target.value)}
                    >
                      {categories.map(cat => (
                        <option key={cat} value={cat}>{cat}</option>
                      ))}
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                  {filteredItems.map(item => (
                    <div key={item.id} className="bg-white rounded-2xl shadow-lg overflow-hidden hover:shadow-2xl transition-shadow duration-300">
                      {item.image ? (
                        <div className="h-80 bg-gray-100 overflow-hidden">
                          <img
                            src={item.image}
                            alt={`${item.brand} ${item.type}`}
                            className="w-full h-full object-cover"
                          />
                        </div>
                      ) : (
                        <div className="h-80 bg-gradient-to-br from-purple-100 to-pink-100 flex items-center justify-center">
                          <p className="text-gray-500">No photo available</p>
                        </div>
                      )}

                      <div className="p-6">
                        <div className="flex justify-between items-start mb-3">
                          <div>
                            <h3 className="text-2xl font-bold text-purple-900">{item.brand}</h3>
                            <p className="text-sm text-purple-600 font-semibold">{item.category}</p>
                          </div>
                          <span className="text-2xl font-bold text-pink-600">{item.price}</span>
                        </div>

                        <div className="space-y-2 mb-4">
                          <p className="text-gray-700"><span className="font-semibold">Type:</span> {item.type}</p>
                          <p className="text-gray-700"><span className="font-semibold">Size:</span> {item.size}</p>
                          <p className="text-gray-700"><span className="font-semibold">Color:</span> {item.color}</p>
                          {item.notes && (
                            <p className="text-sm text-gray-600 italic">{item.notes}</p>
                          )}
                        </div>

                        {item.link && (
                          <a
                            href={item.link}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="inline-block mb-4 text-purple-600 hover:text-purple-800 underline text-sm"
                          >
                            View original listing
                          </a>
                        )}

                        <div className="border-t pt-4 mt-4">
                          <p className="text-sm font-semibold text-gray-900 mb-2">Contact Seller:</p>
                          <div className="space-y-1">
                            <div className="flex items-center text-sm text-gray-700">
                              <Mail />
                              <a href={`mailto:${item.email}`} className="hover:text-purple-600">{item.email}</a>
                            </div>
                            <div className="flex items-center text-sm text-gray-700">
                              <Phone />
                              <span>{item.phone}</span>
                            </div>
                            {item.contactPref && (
                              <div className="flex items-center text-sm text-gray-600">
                                <MessageCircle />
                                <span>Preferred: {item.contactPref}</span>
                              </div>
                            )}
                          </div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                {filteredItems.length === 0 && (
                  <div className="text-center py-20">
                    <p className="text-2xl text-gray-500">No items found matching your search.</p>
                  </div>
                )}
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ClothingSale />);
    </script>
</body>
</html>
